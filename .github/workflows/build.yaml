name: Build rust_pdf_to_img wheel

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build wheel inside manylinux_2_31 Docker container
      - name: Build rust_pdf_to_img wheel (manylinux_2_31)
        run: |
          # Copy source code into temporary directory for Docker mount
          mkdir -p /tmp/build
          rsync -av --exclude target ./rust_pdf_to_img /tmp/build/rust_pdf_to_img

          # Run manylinux_2_31 container
          docker run --rm -v /tmp/build:/io quay.io/pypa/manylinux_2_31_x86_64 \
            bash -c "\
              yum install -y python3 python3-pip make gcc gcc-c++ unzip wget && \
              python3 -m pip install --upgrade pip maturin && \
              cd /io/rust_pdf_to_img && \
              maturin build --release --compatibility manylinux_2_31 \
            "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_pdf_to_img-wheel
          path: rust_pdf_to_img/target/wheels/*.whl
          retention-days: 7
