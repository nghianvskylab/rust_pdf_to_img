name: Build rust_pdf2img wheel

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install maturin
        run: pip install maturin

      - name: Install PDFium (x86_64 Linux)
        run: |
          sudo mkdir -p /usr/local/lib
          wget https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz -O /tmp/pdfium.tgz
          tar xzf /tmp/pdfium.tgz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/local/lib/
          sudo chmod +x /usr/local/lib/libpdfium.so
          sudo ldconfig
          rm -rf /tmp/pdfium.tgz /tmp/lib

      - name: Build rust_pdf2img wheel (manylinux 2_31)
        working-directory: rust_pdf_to_img
        run: maturin build --release --manylinux 2_31

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_pdf2img-wheel
          path: rust_pdf2img/target/wheels/*.whl
          retention-days: 7
